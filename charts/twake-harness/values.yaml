image:
  repository: ghcr.io/linagora/twake-harness
  # Empty uses the chart's appVersion
  tag: ''
  pullPolicy: IfNotPresent
# The registry is private: either name Secrets of type kubernetes.io/dockerconfigjson here, or
# let the chart create one from a read token
imagePullSecrets: []
imagePullSecret:
  create: false
  registry: ghcr.io
  username: ''
  password: ''

# api, matrix or worker
role: api
replicaCount: 1

# The api role scales horizontally on the turns in progress; the other roles stay at one
# replica. The harness exposes harness_turns_inflight on /metrics, which a metrics adapter
# (prometheus-adapter, for instance) must serve as a pods metric for this to apply. Without
# one, replace the metric with a cpu resource target.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Pods
      pods:
        metric:
          name: harness_turns_inflight
        target:
          type: AverageValue
          averageValue: '4'

config:
  authJwksUrl: ''
  authIssuer: ''
  authAudience: ''
  # The other audiences whose tokens may answer a call that waits for its owner, comma separated,
  # such as twakespace for Twake Space's buttons: on the approve and refuse routes of the pending
  # calls, and on no other route; empty for none
  authAnswerAudiences: ''
  # The APISIX address the harness calls for everything: llm, matrix, openbao, contracts, audit
  apisixBaseUrl: ''
  # Where the contracts sit under that address: the prefix of their calls and the path of their
  # curated OpenAPI; empty means the harness defaults, no prefix and contracts/openapi.json.
  # A harness whose APISIX base sits under a prefix reaches the contracts at the root with
  # contractsBasePath '..' and contractsOpenapiPath '../contracts/openapi.json'
  contractsBasePath: ''
  contractsOpenapiPath: ''
  llmModel: qwen3.8
  # Token budget of one model call; empty means the harness default, 8192
  llmMaxTokens: ''
  logLevel: info
  # The language of the assistants' and the creator's fixed texts: en or fr; empty means en
  assistantLocale: ''
  # The IANA time zone the assistants read the present in, such as Europe/Paris, and whose midnight
  # starts a user's day of tokens; empty means UTC
  assistantTimezone: ''
  # The token broker's consent link, the same for every user, which an assistant shows when the
  # broker lacks its owner's permission to act for them, as do the worker role's reminders before
  # that permission expires; an https URL, empty for none, and then the worker reminds nobody
  brokerConsentUrl: ''
  # Whether the assistants propose actions from the messages of channels that are not encrypted
  # (see Suggestions in the README). Off, the channel listener declines its invites and leaves the
  # rooms it is in. On, Synapse must have loaded a registration whose users namespace holds it
  suggestionsEnabled: false
  # The localpart of the channel listener, the visible user room admins invite to channels they
  # want suggestions from; empty means twake-assistant. It must be in the registration
  suggestionsUserLocalpart: ''
  # Twake Space's API, where a suggestion is posted to the notifications of its user; empty means
  # a suggestion reaches the assistant's room alone. Its token, a tws_ API token with the scope
  # notifications:write, goes in secretEnv as SPACE_API_TOKEN. The harness reaches the outside
  # only through APISIX: give an APISIX route here, or an egress rule in networkPolicy.extraEgress
  spaceApiUrl: ''
  # Admission limits; each empty value keeps the harness default
  # Turns in flight on one replica; default 32
  admissionMaxInflight: ''
  # Turns a user may wait for on a full replica; default 2, 0 for no queue
  admissionUserQueue: ''
  # Turns one user may start per minute; default 10
  admissionUserPerMinute: ''
  # Tokens one user may spend per day, from midnight in assistantTimezone; default 200000
  admissionUserDailyTokens: ''
  # Turns the whole harness may start per minute; default 400
  admissionGlobalPerMinute: ''
  # The share of each user's daily tokens kept for their own words, from 0 to 1: the turns activities
  # wake and the briefs may spend the rest, after which activities wake nobody until midnight and a
  # brief is laid out with no model call. Empty means the harness default, 0.5
  chatReserve: ''
  # The most characters of past conversation a turn shows the model, its most recent exchanges
  # whole; the session keeps every message. Empty means the harness default, 24000
  turnHistoryMaxChars: ''
  # The most tool calls one turn may make before it stops. Empty means the harness default, 6
  turnMaxToolCalls: ''
  # The most tokens one turn may spend, the prompts and answers of its model calls summed, before
  # it stops. Empty means the harness default, 250000
  turnMaxTokens: ''
  # How long a turn may go without answering before the assistant posts a status message, which
  # closes once the turn answered, in milliseconds (matrix role); at least 1000. Empty means the
  # harness default, 3000
  turnStatusDelayMs: ''
  # How long a turn an event woke, or one an owner's yes resumed, may wait to start once admission
  # first refused it, in milliseconds (api role): it is tried again until then, never answering
  # that it is busy, and given up past it; the status message of a turn a yes resumed waits as
  # much longer before it gives up (matrix role); at least 1000. Empty means the harness default,
  # 3600000 (an hour)
  turnEventMaxDelayMs: ''
  # Whether an owner's words count only from a session their cross-signing identity signed
  # (matrix role): report, the harness default when empty, takes them all the same and logs and
  # tells the owner what enforce would not take; enforce does not take them
  ownerDeviceTrust: ''
  # The organization agent, a bot of the harness answering the organization's members, named by
  # their Matrix identifiers (comma separated); its localpart lives in the assistants' namespace
  orgAgentEnabled: false
  orgAgentLocalpart: twake-space-assistant-org
  orgAgentName: Twake Space
  orgAgentPersona: ''
  orgAgentMembers: ''
  # The activity exchange of RabbitMQ, which the worker role listens to, and it alone: each
  # recipient of an event of the types below who has an assistant is told of it in their room.
  # The worker then needs matrixServerName or matrixMailDomain below: it wakes the owners by their
  # email on that mail domain
  activityEnabled: false
  # The Secret and key holding the AMQP URL, its vhost included, which carries the password of the
  # instance's own RabbitMQ user; an empty name means the chart's own Secret (secretEnv or
  # existingSecret)
  activityAmqpUrlSecret: ''
  activityAmqpUrlSecretKey: ACTIVITY_AMQP_URL
  # The CloudEvent types that wake an assistant, each exactly (comma separated); empty means the
  # harness default, com.twake.tasks.task.assigned.v1
  activityTypes: ''
  # What the names of the queues and exchanges the instance declares on RabbitMQ start with: its
  # own, which its RabbitMQ user may configure and write; empty means the harness default,
  # twake-harness
  rabbitmqPrefix: ''
  # How many times events from the broker may wake one owner's assistant in a rolling hour,
  # whatever their source (worker role); past it, an event wakes them no more. Empty means the
  # harness default, 20
  wakeupsPerHour: ''
  # How long the worker role keeps a wake-up, in milliseconds, so that an event delivered again or
  # replayed from its dead letter queue wakes nobody twice; empty means the harness default, 30 days
  wakeupsRetentionMs: ''
  # The hour, 0 to 23 on the wall clock of assistantTimezone, at which the worker role reminds the
  # owners whose permission for their assistant to act for them expires within five days; empty
  # means the harness default, 9
  delegationReminderHour: ''
  # The brief of each owner's working day, which the worker role wakes their assistant for, on the
  # days and from the time they chose, Monday to Friday from eight by default, on the wall clock of
  # their calendar's zone, assistantTimezone until a read named one, and within three hours, and
  # which the api role gives them when they ask for it; it needs wakeupsRetentionMs of two days at
  # least
  briefEnabled: false
  # Calendar's fanout of the notifications it sends each invitee, which the worker role listens
  # to, and it alone, on a connection of its own to Calendar's vhost: each invitee of a new
  # invitation who has an assistant is told of it in their room. The worker then needs
  # matrixServerName or matrixMailDomain below: it wakes the owners by their email on that mail
  # domain
  calendarEnabled: false
  # The Secret and key holding the AMQP URL of Calendar's vhost, which carries the password of the
  # instance's own RabbitMQ user; an empty name means the chart's own Secret (secretEnv or
  # existingSecret)
  calendarAmqpUrlSecret: ''
  calendarAmqpUrlSecretKey: CALENDAR_AMQP_URL
  # The service clients, by token subject, allowed to provision an owner's assistant through the
  # provisioning API, such as the identity server Twake Chat asks (comma separated)
  provisionerClientIds: ''
  # The escrow of the assistants' identities in the platform OpenBao, through the openbao route
  # of APISIX, with the pod's Kubernetes identity (matrix role)
  escrowEnabled: false
  openbaoPath: openbao
  openbaoKvMount: secret
  openbaoEscrowPrefix: twake-harness/assistants
  openbaoAuthPath: auth/kubernetes/login
  openbaoK8sRole: twake-harness
  # The audience of the projected token the role presents to OpenBao
  openbaoTokenAudience: twake-harness-openbao
  # The homeserver's name, which the matrix role needs and the api role uses to map an owner's
  # email to their Matrix id when it creates an assistant; then the application service identity
  matrixServerName: ''
  # The mail domain of the homeserver's users, the principal of @alice:<server> being
  # alice@<mail domain>; empty means the server name
  matrixMailDomain: ''
  matrixAppserviceId: twake-harness
  matrixSenderLocalpart: twake-space-assistant
  matrixAssistantPrefix: twake-space-assistant-

# Rendered into a Secret and injected as environment: DATABASE_URL, APISIX_CONSUMER_KEY, and for the
# matrix role MATRIX_HS_TOKEN (and MATRIX_AS_TOKEN when APISIX does not inject it)
# and GATEWAY_SHARED_SECRET on the api role when APISIX sets x-twake-gateway on what it forwards;
# for the worker role that listens to RabbitMQ, ACTIVITY_AMQP_URL and CALENDAR_AMQP_URL unless
# another Secret holds them
secretEnv: {}
# Or the name of a Secret created elsewhere with the same keys
existingSecret: ''

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

networkPolicy:
  enabled: true
  # The only namespace allowed to reach the pods, and the only one they may call
  apisixNamespace: apisix
  # The managed database, outside the cluster
  databaseCidrs: []
  databasePort: 5432
  # The RabbitMQ broker's namespace and AMQP port, which the worker role alone reaches, when it
  # listens to the activity exchange or to Calendar's fanout
  rabbitmqNamespace: ''
  rabbitmqPort: 5672
  # Extra egress rules, in NetworkPolicy syntax
  extraEgress: []

# The matrix role keeps the assistants' encryption state on a volume
persistence:
  enabled: false
  size: 1Gi
  # Empty uses the cluster default
  storageClass: ''
  mountPath: /data

podAnnotations: {}
