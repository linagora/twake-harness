apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "twake-harness.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  # One writer of the volume at a time
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "twake-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twake-harness.labels" . | nindent 8 }}
      annotations:
        {{- if and .Values.secretEnv (not .Values.existingSecret) }}
        checksum/env: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if or .Values.imagePullSecrets .Values.imagePullSecret.create }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
        {{- if .Values.imagePullSecret.create }}
        - name: {{ .Release.Name }}-registry
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness
          image: {{ include "twake-harness.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HARNESS_ROLE
              value: {{ .Values.role | quote }}
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: AUTH_JWKS_URL
              value: {{ .Values.config.authJwksUrl | quote }}
            - name: AUTH_ISSUER
              value: {{ .Values.config.authIssuer | quote }}
            - name: AUTH_AUDIENCE
              value: {{ .Values.config.authAudience | quote }}
            {{- with .Values.config.authAnswerAudiences }}
            - name: AUTH_ANSWER_AUDIENCES
              value: {{ . | quote }}
            {{- end }}
            - name: APISIX_BASE_URL
              value: {{ .Values.config.apisixBaseUrl | quote }}
            {{- /* Every role refreshes the catalog of contracts and the api role calls them: each needs these */}}
            {{- with .Values.config.contractsBasePath }}
            - name: CONTRACTS_BASE_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.contractsOpenapiPath }}
            - name: CONTRACTS_OPENAPI_PATH
              value: {{ . | quote }}
            {{- end }}
            - name: LLM_MODEL
              value: {{ .Values.config.llmModel | quote }}
            {{- with .Values.config.llmMaxTokens }}
            - name: LLM_MAX_TOKENS
              value: {{ . | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- with .Values.config.assistantLocale }}
            - name: ASSISTANT_LOCALE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.assistantTimezone }}
            - name: ASSISTANT_TIMEZONE
              value: {{ . | quote }}
            {{- end }}
            {{- /* The api role shows it when the broker lacks an owner's permission, the worker role in its reminders before that permission expires */}}
            {{- with .Values.config.brokerConsentUrl }}
            - name: BROKER_CONSENT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.suggestionsEnabled }}
            - name: SUGGESTIONS_ENABLED
              value: "true"
            {{- end }}
            {{- with .Values.config.suggestionsUserLocalpart }}
            - name: SUGGESTIONS_USER_LOCALPART
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.spaceApiUrl }}
            - name: SPACE_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- /* Rendered as integers, so 0 counts and a large value from a values file is not 1e+06 */}}
            {{- $admission := dict "ADMISSION_MAX_INFLIGHT" .Values.config.admissionMaxInflight "ADMISSION_USER_QUEUE" .Values.config.admissionUserQueue "ADMISSION_USER_PER_MINUTE" .Values.config.admissionUserPerMinute "ADMISSION_USER_DAILY_TOKENS" .Values.config.admissionUserDailyTokens "ADMISSION_GLOBAL_PER_MINUTE" .Values.config.admissionGlobalPerMinute }}
            {{- range $name, $value := $admission }}
            {{- if and (not (kindIs "invalid" $value)) (ne (toString $value) "") }}
            - name: {{ $name }}
              value: {{ $value | int64 | quote }}
            {{- end }}
            {{- end }}
            {{- /* A share from 0 to 1, rendered as given, so 0 counts */}}
            {{- $chatReserve := .Values.config.chatReserve }}
            {{- if and (not (kindIs "invalid" $chatReserve)) (ne (toString $chatReserve) "") }}
            - name: CHAT_RESERVE
              value: {{ $chatReserve | toString | quote }}
            {{- end }}
            {{- with .Values.config.turnHistoryMaxChars }}
            - name: TURN_HISTORY_MAX_CHARS
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.config.turnMaxToolCalls }}
            - name: TURN_MAX_TOOL_CALLS
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.config.turnMaxTokens }}
            - name: TURN_MAX_TOKENS
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.config.turnStatusDelayMs }}
            - name: TURN_STATUS_DELAY_MS
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- /* The api role runs the turns, the events' among them, and the matrix role keeps the status of a turn a yes resumed while admission may keep it waiting */}}
            {{- if has .Values.role (list "api" "matrix") }}
            {{- with .Values.config.turnEventMaxDelayMs }}
            - name: TURN_EVENT_MAX_DELAY_MS
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- end }}
            {{- /* Checked on every role, rendered on the matrix role, the only one that reads owner words */}}
            {{- with .Values.config.ownerDeviceTrust }}
            {{- if not (has . (list "report" "enforce")) }}
            {{- fail "config.ownerDeviceTrust must be report or enforce" }}
            {{- end }}
            {{- if eq $.Values.role "matrix" }}
            - name: OWNER_DEVICE_TRUST
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: ORG_AGENT_ENABLED
              value: {{ .Values.config.orgAgentEnabled | quote }}
            - name: ORG_AGENT_LOCALPART
              value: {{ .Values.config.orgAgentLocalpart | quote }}
            - name: ORG_AGENT_NAME
              value: {{ .Values.config.orgAgentName | quote }}
            {{- with .Values.config.orgAgentPersona }}
            - name: ORG_AGENT_PERSONA
              value: {{ . | quote }}
            {{- end }}
            - name: ORG_AGENT_MEMBERS
              value: {{ .Values.config.orgAgentMembers | quote }}
            - name: PROVISIONER_CLIENT_IDS
              value: {{ .Values.config.provisionerClientIds | quote }}
            {{- /* The worker role alone listens to RabbitMQ, and only it gets the broker's address. It wakes the owners by their email on the mail domain, MATRIX_MAIL_DOMAIN or else MATRIX_SERVER_NAME, which every role gets when set */}}
            {{- if include "twake-harness.listens" . }}
            {{- if not (or .Values.config.matrixServerName .Values.config.matrixMailDomain) }}
            {{- fail "config.matrixServerName or config.matrixMailDomain must be set for the worker role to listen to RabbitMQ: it wakes the owners by their email on that mail domain" }}
            {{- end }}
            {{- with .Values.config.rabbitmqPrefix }}
            - name: RABBITMQ_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.activityEnabled }}
            - name: ACTIVITY_ENABLED
              value: "true"
            - name: ACTIVITY_AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.activityAmqpUrlSecret | default (include "twake-harness.secretName" .) }}
                  key: {{ .Values.config.activityAmqpUrlSecretKey }}
            {{- with .Values.config.activityTypes }}
            - name: ACTIVITY_TYPES
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.calendarEnabled }}
            - name: CALENDAR_ENABLED
              value: "true"
            - name: CALENDAR_AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.calendarAmqpUrlSecret | default (include "twake-harness.secretName" .) }}
                  key: {{ .Values.config.calendarAmqpUrlSecretKey }}
            {{- end }}
            {{- end }}
            {{- /* The worker role wakes the assistants for the events of every source it listens to */}}
            {{- if eq .Values.role "worker" }}
            {{- with .Values.config.wakeupsPerHour }}
            - name: WAKEUPS_PER_HOUR
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- /* The worker role purges the wake-ups, whether it listens or not, and reads it as an integer: 0 counts, as for the admission, for the harness to refuse it */}}
            {{- $retention := .Values.config.wakeupsRetentionMs }}
            {{- if and (not (kindIs "invalid" $retention)) (ne (toString $retention) "") }}
            - name: WAKEUPS_RETENTION_MS
              value: {{ $retention | int64 | quote }}
            {{- end }}
            {{- /* The worker role reminds the owners whose permission is about to expire, at an hour read as an integer: 0, midnight, counts */}}
            {{- $reminderHour := .Values.config.delegationReminderHour }}
            {{- if and (not (kindIs "invalid" $reminderHour)) (ne (toString $reminderHour) "") }}
            - name: DELEGATION_REMINDER_HOUR
              value: {{ $reminderHour | int64 | quote }}
            {{- end }}
            {{- end }}
            {{- /* The worker role wakes the assistants for their owners' briefs, which the harness refuses with under two days of wake-ups kept, and the api role, which runs the owners' turns, gives them their brief when they ask for it */}}
            {{- if and (has .Values.role (list "api" "worker")) .Values.config.briefEnabled }}
            - name: BRIEF_ENABLED
              value: "true"
            {{- end }}
            {{- /* Every role that maps an owner's email to their Matrix id, or names an assistant, needs these */}}
            {{- with .Values.config.matrixServerName }}
            - name: MATRIX_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.matrixMailDomain }}
            - name: MATRIX_MAIL_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.matrixAssistantPrefix }}
            - name: MATRIX_ASSISTANT_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.role "matrix" }}
            - name: MATRIX_APPSERVICE_ID
              value: {{ .Values.config.matrixAppserviceId | quote }}
            - name: MATRIX_SENDER_LOCALPART
              value: {{ .Values.config.matrixSenderLocalpart | quote }}
            - name: MATRIX_CRYPTO_STORE_PATH
              value: {{ printf "%s/crypto" .Values.persistence.mountPath | quote }}
            {{- if .Values.config.escrowEnabled }}
            - name: ESCROW_ENABLED
              value: "true"
            - name: OPENBAO_PATH
              value: {{ .Values.config.openbaoPath | quote }}
            - name: OPENBAO_KV_MOUNT
              value: {{ .Values.config.openbaoKvMount | quote }}
            - name: OPENBAO_ESCROW_PREFIX
              value: {{ .Values.config.openbaoEscrowPrefix | quote }}
            - name: OPENBAO_AUTH_PATH
              value: {{ .Values.config.openbaoAuthPath | quote }}
            - name: OPENBAO_K8S_ROLE
              value: {{ .Values.config.openbaoK8sRole | quote }}
            - name: OPENBAO_K8S_TOKEN_PATH
              value: /var/run/secrets/openbao/token
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "twake-harness.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            {{- if and (eq .Values.role "matrix") .Values.config.escrowEnabled }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- end }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        {{- if and (eq .Values.role "matrix") .Values.config.escrowEnabled }}
        # A token bound to the OpenBao audience, for the Kubernetes auth method
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.config.openbaoTokenAudience | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
      {{- end }}
